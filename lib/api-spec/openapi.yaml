openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: EcoDev analysis API
servers:
  - url: /api
    description: Base API path
paths:

  /api/benchmarks:
    get:
      summary: List built-in EcoDev benchmark cases
      responses:
        '200':
          description: Benchmark suite metadata
  /api/benchmarks/{id}/run:
    post:
      summary: Run a built-in benchmark case in the secure sandbox
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: ECO-01 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                warmups: { type: integer, minimum: 0, maximum: 2, default: 2 }
                iterations: { type: integer, minimum: 1, maximum: 5, default: 5 }
      responses:
        '200':
          description: Benchmark measurements or explicit sandbox-unavailable status
        '404':
          description: Unknown benchmark case
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
  /analyze:
    post:
      operationId: analyzeCode
      summary: Analyze and optionally execute a code submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '200':
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '400': { description: Invalid request }
        '413': { description: Submission too large }
        '422': { description: Language could not be inferred }
components:
  schemas:
    AnalyzeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 200000 }
        language: { type: string, enum: [javascript, typescript, python, c, cpp, go] }
        compareCode: { type: string, maxLength: 200000 }
        compareLanguage: { type: string, enum: [javascript, typescript, python, c, cpp, go] }
        execute: { type: boolean, default: true }
        benchmarkIterations: { type: integer, minimum: 1, maximum: 5, default: 1 }
        preferences:
          type: object
          properties:
            profile: { type: string, enum: [balanced, fast, memory, green, reliable, secure, scalable] }
            instruction: { type: string, maxLength: 2000 }
            weights: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 100 } }
        eco:
          type: object
          description: Regional grid and SCI-style reporting options. Energy remains modeled unless a hardware meter is attached.
          properties:
            region: { type: string }
            gridFactorGPerKwh: { type: number, minimum: 0 }
            gridSource: { type: string }
            gridYear: { oneOf: [{ type: string }, { type: number }] }
            functionalUnit: { type: string, enum: [execution, request, transaction, job, batch, custom] }
            functionalUnitCount: { type: number, exclusiveMinimum: 0 }
            embodiedEmissionsGrams: { type: number, minimum: 0 }
    AnalyzeResponse:
      type: object
      required: [ok, submission, analysis, eco]
      properties:
        ok: { type: boolean }
        submission: { type: object, additionalProperties: true }
        analysis: { type: object, additionalProperties: true }
        compile: { type: [object, 'null'], additionalProperties: true }
        execution: { type: [object, 'null'], additionalProperties: true }
        eco: { type: object, additionalProperties: true }
        comparison: { type: [object, 'null'], additionalProperties: true }
        limits: { type: object, additionalProperties: true }
        model: { type: object, additionalProperties: true }
