name: EcoDev App Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            args: --linux AppImage
          - os: windows-latest
            target: windows
            args: --win nsis
          - os: macos-latest
            target: mac
            args: --mac dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Build production frontend
        run: pnpm --filter @workspace/ecodev build
      - name: Build production API
        run: pnpm --filter @workspace/api-server build
      - name: Prepare embedded desktop payload
        run: node scripts/prepare-desktop-package.mjs
      - name: Install Electron dependencies
        working-directory: integrations/desktop-app
        run: npm install
      - name: Build desktop package
        working-directory: integrations/desktop-app
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecodev-desktop-${{ matrix.target }}
          path: integrations/desktop-app/dist/*
          if-no-files-found: error

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install extension dependencies
        run: npm install
      - name: Package VS Code extension
        run: npx @vscode/vsce package --no-dependencies
      - name: Upload VS Code extension
        uses: actions/upload-artifact@v4
        with:
          name: ecodev-vscode
          path: integrations/vscode/*.vsix
          if-no-files-found: error

  release:
    needs: [desktop, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
